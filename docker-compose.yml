services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gscores
      POSTGRES_PASSWORD: gscores
      POSTGRES_DB: gscores
    ports:
      - "5433:5432" # 5433 on host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gscores"]
      interval: 3s
      retries: 20

  # One-shot: run migrations + seed, then exit (same role as the K8s Job).
  seed:
    build: { context: ., dockerfile: backend/Dockerfile, target: seeder }
    environment: &db-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: gscores
      DB_PASSWORD: gscores
      DB_NAME: gscores
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: runtime }
    environment: *db-env
    ports:
      - "3000:3000"
    depends_on:
      seed: { condition: service_completed_successfully }

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
