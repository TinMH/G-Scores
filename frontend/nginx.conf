server {
  listen 80;
  server_tokens off; # don't advertise the nginx version
  root /usr/share/nginx/html;

  # Text assets compress ~4x (the JS bundles are the bulk of the page weight).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Basic hardening. A location that sets its own add_header does not inherit these, so it repeats them.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # "api" resolves to the API service in both docker-compose and K8s (same namespace).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite emits content-hashed file names, so these never change: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # The entry document points at the current hashed bundles: always revalidate it so a new deploy is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # SPA fallback for client-side routes (serves /index.html, so it gets the no-cache rule above)
  location / {
    try_files $uri /index.html;
  }
}
