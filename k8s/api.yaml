apiVersion: v1
kind: Service
metadata:
  name: api # nginx in the web pod proxies /api to http://api:3000
spec:
  selector: { app: api }
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: gscores-api
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: gscores-config }
            - secretRef: { name: gscores-db }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
