# Assumes an ingress controller (k3s ships Traefik) and cert-manager with a ClusterIssuer "letsencrypt".
# Replace gscores.example.com with your domain (or a free one like <ip>.sslip.io).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gscores
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts: [gscores.example.com]
      secretName: gscores-tls
  rules:
    - host: gscores.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
