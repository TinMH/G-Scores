apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gscores
# The Namespace is created once by an admin (kubectl apply -f k8s/namespace.yaml). It is cluster-scoped, and the
# release pipeline's ServiceAccount is deliberately limited to the gscores namespace itself.
resources:
  - config.yaml
  - postgres.yaml
  - seed-job.yaml
  - api.yaml
  - web.yaml
  - istio.yaml
# Images are public on GHCR (no pull secret needed). Pinned to a commit tag so a deploy is reproducible;
# bump newTag to the short SHA of the commit you want (CI pushes ghcr.io/tinmh/gscores-*:<sha> and :latest).
images:
  - name: gscores-api
    newName: ghcr.io/tinmh/gscores-api
    newTag: "00d853f"
  - name: gscores-seeder
    newName: ghcr.io/tinmh/gscores-seeder
    newTag: "00d853f"
  - name: gscores-web
    newName: ghcr.io/tinmh/gscores-web
    newTag: "00d853f"
